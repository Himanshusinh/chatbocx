<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: olfile:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>OfficeLink</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="titlebar-space drag"></div>
        <div class="side-head drag">
          <button id="me-btn" class="me no-drag" title="Your status and profile"></button>
          <button id="new-btn" class="icon-btn no-drag" title="New group, add someone, find people"></button>
          <button id="settings-btn" class="icon-btn no-drag" title="Settings"></button>
        </div>
        <div class="side-search">
          <input id="side-filter" type="search" placeholder="Search chats and people" autocomplete="off" />
        </div>
        <div id="side-tabs" class="side-tabs">
          <button type="button" data-tab="all" class="on">All</button>
          <button type="button" data-tab="unread">Unread</button>
          <button type="button" data-tab="people">People</button>
          <button type="button" data-tab="groups">Groups</button>
        </div>
        <div id="conv-list" class="conv-list"></div>
        <button type="button" id="net-btn" class="net-btn" title="Connection, addresses and people on the network"></button>
      </aside>
      <main id="main">
        <header id="chat-head" class="chat-head drag"></header>
        <div id="alert-banner" class="alert-banner" hidden></div>
        <div id="update-banner" class="update-banner" hidden></div>
        <div id="search-panel" class="search-panel" hidden>
          <input id="search-input" type="search" placeholder="Search messages and files in this chat" autocomplete="off" />
          <div id="search-results" class="search-results"></div>
        </div>
        <div class="messages-wrap">
          <div id="messages" class="messages"></div>
          <button id="jump-latest" class="jump-latest" hidden></button>
        </div>
        <div id="typing" class="typing"></div>
        <div id="composer" class="composer">
          <div id="compose-banner" class="compose-banner" hidden></div>
          <div class="compose-row">
            <button id="attach-btn" class="icon-btn" title="Share files (any size)"></button>
            <div class="compose-input">
              <div id="mention-list" class="mention-list" hidden></div>
              <textarea id="input" rows="1" placeholder="Write a message"></textarea>
            </div>
            <button id="emoji-btn" class="icon-btn" title="Emoji"></button>
            <button id="send-btn" class="send-btn" title="Send (Enter)"></button>
          </div>
        </div>
        <div id="drop-overlay" class="drop-overlay" hidden>
          <div class="drop-card">
            <div class="drop-icon"></div>
            <div class="drop-title">Drop to share</div>
            <div id="drop-sub" class="drop-sub"></div>
          </div>
        </div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="popover-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script src="app.js"></script>
  </body>
</html>
